<!DOCTYPE html>
<html>
<head>
    <title>Change Font Size - URK24CS1150 </title>
    <style>
        body {
            text-align: center;
            font-family: Arial;
            margin-top: 100px;
        }
        #para1 {
            font-size: 20px;
        }
    </style>
</head>
<body>
    <h1>Change Font Size - URK24CS1150 </h1>
    <p id="para1"
       onmouseover="incSize()"
       onmouseout="decSize()">
       Move the cursor over this paragraph.
    </p>
    <script>
    function incSize() {
        document.getElementById("para1").style.fontSize = "30px";
    }
    function decSize() {
        document.getElementById("para1").style.fontSize = "20px";
    }
    </script>
</body>
</html>
