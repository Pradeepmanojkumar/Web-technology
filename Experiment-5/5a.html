<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BMI Calculator - URK24CS1150</title>
</head>
<body>
    <h2>BMI Calculator - URK24CS1150</h2>
    <label for="weight">Weight (kg):</label>
    <input type="number" id="weight" step="0.1">
    <br><br>
    <label for="height">Height (cm):</label>
    <input type="number" id="height" step="0.1">
    <br><br>
    <button onclick="calculate()">Get BMI</button>
    
    <p>
        The BMI is: <span id="score"></span><br>
        The Body Type is: <span id="type"></span>
    </p>
    <script>
        function calculate() {
            var weight = parseFloat(document.getElementById("weight").value);
            var height = parseFloat(document.getElementById("height").value);

            if (isNaN(weight) || isNaN(height) || height <= 0 || weight <= 0) {
                alert("Please enter valid positive numbers for weight and height.");
                return;
            }
            height = height / 100;
  
            var bmi = weight / (height * height);
            document.getElementById("score").innerHTML = bmi.toFixed(2);
            if (bmi < 18.5) {
                document.getElementById("type").innerHTML = "Underweight";
            } else if (bmi < 25) {
                document.getElementById("type").innerHTML = "Normal";
            } else if (bmi < 30) {
                document.getElementById("type").innerHTML = "Overweight";
            } else {
                document.getElementById("type").innerHTML = "Obese";
            }
        }
    </script>
</body>
</html>
